<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="eliminarEventos.js"></script>
    <title>Document Object Model</title>
</head>

<body>
    <div class="contenedor-principal">
        <div class="contenedor  " id="contenedor1">
            <div class="caja activa">Caja 1</div>
            <div class="caja">Caja 2</div>
            <div class="caja">Caja 3</div>
        </div>
        <div class="contenedor" id="contenedor2">
            <div class="caja">Caja 1</div>
            <div class="caja">Caja 2</div>
            <div class="caja">Caja 3</div>
        </div>

        <button id="agregar-evento">Agregar EVENTO</button>
        <button id="eliminar-evento">Eliminar de EVENTO</button>
        <button id="boton">Como agregar eventos</button>
        <button onclick="incrementarFuente()"><span>Incrementar</span> Fuente</button>
        <button onclick="disminuirFuente()"><span>Disminuir</span> Fuente</button>
        <button id="boton1" onclick="agregarCaja()">Agregar <span>CAJA</span> desde el <span>DOM</span></button>
        <button id="boton2" onclick="eliminarCaja()">Eliminar <span>CAJA</span> desde el <span>DOM</span></button>
        <button id="boton3" onclick="agregarClase()">Agregar <span>CLASE</span> desde el <span>DOM</span></button>
        <button id="boton4" onclick="eliminarClase()">Eliminar <span>CLASE</span> desde el <span>DOM</span></button>
        <button id="boton5" onclick="toggleClase()"><span>Combina</span> entre <span>Agregar y Eliminar</span> CLASE</button>
        <button id="boton6" onclick="comprobarClase()"><span>Comprueba</span> si tiene o no CLASE</button>
    </div>
</body>

</html>
